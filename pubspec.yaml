name: agoralink
description: "A new cross platform information center for communities."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  geolocator_web: ^4.0.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/assets/images/logo.png
    